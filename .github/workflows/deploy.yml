# Deploy frontend build to production server on push to main.
#
# Runs on the self-hosted runner registered directly on the deploy server
# (killerwhalee-serv-o), so no SSH hop is needed — the built dist/ is rsynced
# locally into the directory nginx serves.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: monkey-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, serv-o]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy dist/
        run: rsync -a --delete dist/ /home/killerwhalee/monkey/frontend/
